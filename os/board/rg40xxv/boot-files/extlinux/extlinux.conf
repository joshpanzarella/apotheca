# Read by U-Boot. The device tree is $fdtfile, read from this partition
# (FDTDIR /), which U-Boot sets as it starts (uboot.fragment, CONFIG_PREBOOT):
#   dtb.img, when there is one here: a tree copied by hand always wins;
#   else the tree for the screen screen-first.txt or screen-v2.txt names,
#   when one of them is here;
#   else the tree for the screen this handheld has, by pin PE6, as
#   Anbernic's own boot loader tells them apart:
#     device_trees/sun50i-h700-anbernic-rg40xx-v-v2-panel.dtb  (PE6 low)
#     device_trees/sun50i-h700-anbernic-rg40xx-v.dtb           (PE6 high)
# See README.txt on this partition.
# The root is found and mounted by the kernel's own first program (the
# initramfs's /init, board/rg40xxv/early/init.c), which reads root= and
# rootfstype= here. panic=5: a kernel that stops with a panic resets after
# 5 s, so U-Boot can save what it said (firmware plan, section 16).
# console=ttyS0,115200, and no console on the screen: the kernel's messages
# and everything said to /dev/console go to the serial line only. The screen
# keeps the SHAPETAKER / APOTHECA picture, nothing else.
# The messages are still kept (the boot log has them all): loglevel=5.
# The level stays above quiet (4): at 4 or under the kernel draws no boot
# logo at all (fbcon), and the picture never shows.
# For a hunt: loglevel=8 initcall_debug log_buf_len=1M names every driver as
# it starts and adds many seconds (firmware plan, section 16). To see the
# messages on the screen again, add console=tty1 here.
DEFAULT apotheca
LABEL apotheca
	LINUX /Image
	FDTDIR /
	APPEND root=PARTUUID=41504f54-02 rootfstype=squashfs ro rootwait console=ttyS0,115200 fbcon=logo-count:1 loglevel=5 panic=5
