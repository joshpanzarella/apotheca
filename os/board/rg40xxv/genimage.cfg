# The SD card image (written by post-image.sh through genimage).
#
#   8 KiB    U-Boot SPL + U-Boot (u-boot-sunxi-with-spl.bin): the H700's
#            boot ROM reads the SPL from 8 KiB on the card
#   4 MiB    p1 BOOT    FAT32, 64 MiB: kernel, device trees, extlinux.conf
#   68 MiB   p2 ROOT-A  squashfs, read-only: the system
#            p3 ROOT-B  the same size, empty: the second slot for batch 5's
#                       whole-system updates
#            p4 DATA    32 MiB of zeros here. The first boot grows it to the
#                       end of the card and makes it exFAT, APOTHECA: logs
#                       now, songs and recordings later (/etc/init.d/S05data).
#                       Made on the device, not here, because mkfs.exfat
#                       writes the clock into it and the image would differ
#                       from one build to the next.
#
# The disk signature makes the partitions' PARTUUIDs 41504f54-0N ("APOT"),
# which the kernel command line names the root by.

image boot.vfat {
	vfat {
		label = "APOTHBOOT"
		extraargs = "-F 32 -i 41504f54 --invariant"
		files = {
			"boot/Image",
			"boot/dtb.img",
			"boot/device_trees",
			"boot/extlinux",
			"boot/README.txt",
			"boot/dtb-in-use.txt"
		}
	}
	size = 64M
}

image apotheca-rg40xxv.img {
	hdimage {
		partition-table-type = "mbr"
		disk-signature = 0x41504f54
	}

	partition u-boot {
		in-partition-table = false
		image = "u-boot-sunxi-with-spl.bin"
		offset = 8K
		size = 4088K
	}

	partition boot {
		partition-type = 0x0c
		bootable = true
		image = "boot.vfat"
		offset = 4M
		size = 64M
	}

	partition root-a {
		partition-type = 0x83
		image = "rootfs.squashfs"
		size = 256M
	}

	partition root-b {
		partition-type = 0x83
		image = "empty-slot.img"
		size = 256M
	}

	partition data {
		partition-type = 0x07
		image = "empty-data.img"
		size = 32M
	}
}
